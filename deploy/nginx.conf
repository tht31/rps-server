# nginx.conf - Toi uu tai cho 1.000 nguoi doc & chong spam nop bai
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    # Rate limit zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=2r/m;
    limit_req_zone $binary_remote_addr zone=register_limit:10m rate=10r/15m;

    upstream api_upstream {
        server api:4000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name arena.university.edu.vn;

        # Bot submission - gioi han 2 lan/phut, toi da 1MB
        location /api/bots/submit {
            limit_req zone=upload_limit burst=3 nodelay;
            client_max_body_size 1M;
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Dang ky doi - gioi han chong spam
        location /api/teams/register {
            limit_req zone=register_limit burst=5 nodelay;
            proxy_pass http://api_upstream;
        }

        # Leaderboard - micro-caching 3 giay giam tai DB
        location /api/tournaments/swiss/standings {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_cache_valid 200 3s;
            add_header X-Cache-Status $upstream_cache_status;
            proxy_pass http://api_upstream;
        }

        # WebSocket - cho lenh live
        location /ws {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }

        # Con lai - gioi han chung
        location /api/ {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Health check
        location /health {
            proxy_pass http://api_upstream;
        }
    }
}
